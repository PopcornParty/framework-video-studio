name: Render production

on:
  workflow_dispatch:
    inputs:
      dna:
        description: 'Paste an FW1: compact code, a FRAMEWORK DNA v1 block, or raw JSON'
        required: true
        type: string
      music_url:
        description: 'Optional HTTPS link to your own licensed music. Used only when DNA music origin is user-provided.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation zip

      - name: Validate DNA
        env:
          DNA: ${{ inputs.dna }}
        run: |
          mkdir -p job render-out
          if [ -z "$DNA" ]; then
            printf 'FAILED\nNo DNA was provided.\n' > render-out/report.txt
            echo "DNA input is required."
            exit 1
          fi
          node scripts/validate-dna.mjs

      - name: Fetch user music
        env:
          MUSIC_URL: ${{ inputs.music_url }}
        run: node scripts/fetch-user-music.mjs job/dna.json job

      - name: Download assets and render
        run: node scripts/render-job.mjs job/dna.json job render-out

      - name: Check MP4
        run: |
          test -f render-out/video.mp4
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 render-out/video.mp4)
          streams=$(ffprobe -v error -show_entries stream=codec_type -of csv=p=0 render-out/video.mp4)
          python3 - <<PY
          import os
          dur=float("$dur" or 0)
          assert dur > 0, 'MP4 has no duration'
          size=os.path.getsize('render-out/video.mp4')
          report=open('render-out/report.txt').read()
          if 'music=yes' in report and 'audio' not in """$streams""":
              raise SystemExit('Music was requested but no audio stream exists')
          if os.path.exists('render-out/subtitles.srt'):
              print('subtitles present')
          open('render-out/report.txt','a').write(f'mp4_bytes={size}\nchecked=ffprobe\n')
          print('checked', dur, size)
          PY

      - name: Package ZIP
        if: success()
        run: node scripts/package-render.mjs render-out .

      - name: Check ZIP contents
        if: success()
        run: |
          unzip -l framework-render.zip
          python3 - <<'PY'
          import zipfile
          names = set(zipfile.ZipFile('framework-render.zip').namelist())
          allowed = {'video.mp4', 'subtitles.srt', 'subtitles.ass', 'report.txt'}
          extra = names - allowed
          missing = {'video.mp4', 'report.txt'} - names
          if extra or missing:
              raise SystemExit(f'ZIP contents invalid. extra={sorted(extra)} missing={sorted(missing)}')
          print('zip ok', sorted(names))
          PY

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "render-${{ github.run_id }}" \
            render-out/video.mp4 framework-render.zip \
            --title "Render ${{ github.run_id }}" \
            --notes "Real render. MP4 passed ffprobe verification. ZIP contains only the finished files."

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: framework-render
          path: framework-render.zip

      - name: Upload debug package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: framework-debug
          path: framework-debug.zip
