name: Render production

on:
  workflow_dispatch:
    inputs:
      dna:
        description: 'Paste FRAMEWORK DNA v1 JSON. Leave empty if using job_path.'
        required: false
        type: string
      job_path:
        description: 'Optional repo folder with dna.json and media/, e.g. jobs/my-video'
        required: false
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare job
        env:
          DNA: ${{ inputs.dna }}
          JOB_PATH: ${{ inputs.job_path }}
        run: |
          mkdir -p job/media render-out
          if [ -n "$JOB_PATH" ]; then
            case "$JOB_PATH" in
              jobs/*) ;;
              *) echo "job_path must start with jobs/"; exit 1 ;;
            esac
            test -f "$JOB_PATH/dna.json"
            cp "$JOB_PATH/dna.json" job/dna.json
            if [ -d "$JOB_PATH/media" ]; then cp -r "$JOB_PATH/media/." job/media/; fi
          elif [ -n "$DNA" ]; then
            printf '%s' "$DNA" > job/dna.json
          else
            echo "Provide DNA or a job_path. Nothing was rendered."
            printf 'FAILED\nNo DNA was provided.\n' > render-out/report.txt
            exit 1
          fi
      - name: Render
        run: node scripts/render-job.mjs job/dna.json job/media render-out
      - name: Package
        if: always()
        run: |
          cd render-out
          zip -r ../framework-render.zip .
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-render
          path: framework-render.zip
          if-no-files-found: error
