name: Render production

on:
  workflow_dispatch:
    inputs:
      dna:
        description: 'Paste FRAMEWORK DNA v1 JSON. Leave empty if using job_path.'
        required: false
        type: string
      job_path:
        description: 'Optional repo folder with dna.json and media/, e.g. jobs/my-video'
        required: false
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare job
        id: prep
        run: |
          mkdir -p job/media render-out
          if [ -n "${{ inputs.job_path }}" ]; then
            test -f "${{ inputs.job_path }}/dna.json"
            cp "${{ inputs.job_path }}/dna.json" job/dna.json
            if [ -d "${{ inputs.job_path }}/media" ]; then cp -r "${{ inputs.job_path }}/media/." job/media/; fi
          elif [ -n "${{ inputs.dna }}" ]; then
            printf '%s' "${{ inputs.dna }}" > job/dna.json
          else
            echo "Provide DNA or a job_path. Nothing was rendered."
            echo "FAILED" > render-out/report.txt
            echo "No DNA was provided." >> render-out/report.txt
            exit 1
          fi
      - name: Render
        run: node scripts/render-job.mjs job/dna.json job/media render-out
      - name: Package
        if: always()
        run: |
          cd render-out
          zip -r ../framework-render.zip .
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-render
          path: framework-render.zip
          if-no-files-found: error
