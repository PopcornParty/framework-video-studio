name: Render production

on:
  workflow_dispatch:
    inputs:
      dna:
        description: 'Paste FRAMEWORK DNA v1 JSON. Leave empty if using job_path.'
        required: false
        type: string
      job_path:
        description: 'Optional repo folder with dna.json and media/, e.g. jobs/my-video'
        required: false
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate DNA
        env:
          DNA: ${{ inputs.dna }}
          JOB_PATH: ${{ inputs.job_path }}
        run: |
          mkdir -p job/media render-out
          if [ -n "$JOB_PATH" ]; then
            case "$JOB_PATH" in
              jobs/*) ;;
              *) echo "job_path must start with jobs/"; exit 1 ;;
            esac
            test -f "$JOB_PATH/dna.json"
            cp "$JOB_PATH/dna.json" job/dna.json
            if [ -d "$JOB_PATH/media" ]; then cp -r "$JOB_PATH/media/." job/media/; fi
          elif [ -n "$DNA" ]; then
            printf '%s' "$DNA" > job/dna.json
          else
            printf 'FAILED\nNo DNA was provided.\n' > render-out/report.txt
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('job/dna.json','utf8'))"
      - name: Download assets and render
        run: node scripts/render-job.mjs job/dna.json job/media render-out
      - name: Check MP4
        run: |
          test -f render-out/video.mp4
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 render-out/video.mp4)
          python3 - <<PY
          import os
          dur=float("$dur" or 0)
          assert dur > 0, 'MP4 has no duration'
          size=os.path.getsize('render-out/video.mp4')
          open('render-out/report.txt','a').write(f'mp4_bytes={size}\nchecked=ffprobe\n')
          print('checked', dur, size)
          PY
      - name: Package ZIP
        if: always()
        run: |
          cd render-out
          zip -r ../framework-render.zip .
          cp ../framework-render.zip .
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "render-${{ github.run_id }}" \
            render-out/video.mp4 render-out/framework-render.zip \
            --title "Render ${{ github.run_id }}" \
            --notes "Real render. MP4 passed ffprobe."
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: framework-render
          path: framework-render.zip
